thiserror.workspace = true
tracing.workspace = true
unroll.workspace = true

[dev-dependencies]
blake3 = "1.5"
clap.workspace = true
libmimalloc-sys.workspace = true
mimalloc.workspace = true
p3-air.workspace = true
p3-challenger.workspace = true
